# GeneralsX macOS DXVK runtime configuration
#
# Keep sampler-type spec constants disabled by default.
# This setting is part of our macOS terrain shader stability baseline.
# DXVK source-of-truth is maintained in the fbraz3 fork branch.

d3d9.forceSamplerTypeSpecConstants = False

# GeneralsX @tweak Claude 27/07/2026 Bring macOS to parity with ios/config/dxvk.conf, which has
# carried both of the settings below for some time. The macOS file had exactly one line, and that
# line already matched DXVK's compiled-in default, so this config was doing nothing at all.

# 16x anisotropic filtering. The RTS camera views terrain at a shallow angle, which is the worst
# case for plain trilinear filtering - ground textures smear into mud toward the horizon.
#
# Note this is a global sampler override: it applies to UI quads and the present blit too, not
# just terrain. That is acceptable on an M-series GPU. It also does NOT on its own remove the
# visible mip transition band, because the mip filter stays POINT - that is engine-side state and
# needs "TextureFilter = Anisotropic" in Options.ini, which is only applied once at device
# creation (W3DDisplay.cpp:1038), so it needs a relaunch rather than an options-menu toggle.
d3d9.samplerAnisotropy = 16

# No debug logging in normal play. The D3D8 layer emits a warning for every
# SetRenderState(D3DRS_PATCHSEGMENTS), which the engine issues every frame, so the log grows by
# hundreds of KB per session and each line is a synchronous file write on the render thread.
dxvk.logLevel = none

# Vsync is currently OFF on macOS in both windowed and fullscreen - measured
# VK_PRESENT_MODE_IMMEDIATE_KHR on every run, on a 120Hz panel, which tears continuously.
#
# Left commented rather than enabled: turning it on caps the frame rate at the refresh rate, and
# the uncapped path here is deliberate (-fps / -noFPSLimit were lifted out of the debug-only build
# on purpose). Uncomment if tearing bothers you more than the cap does.
# d3d9.presentInterval = 1
